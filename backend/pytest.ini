[pytest]
# Pytest configuration for Remindr

# Minimum pytest version
minversion = 7.0

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (require external services)
    performance: Performance benchmarks (may be slow)
    slow: Tests that take more than 1 second
    asyncio: Tests using asyncio (handled by pytest-asyncio)

# Asyncio mode
asyncio_mode = auto

# Output options
console_output_style = progress
addopts = 
    --strict-markers
    --tb=short
    --disable-warnings
    -ra

# Coverage options (when using --cov)
[coverage:run]
source = app
omit = 
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */.venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

# Ignore expected warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
