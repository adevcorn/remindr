name: remindr
description: Intelligent productivity tool for capturing tasks and events
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # HTTP & API
  http: ^1.1.0
  dio: ^5.4.0
  
  # Local Storage
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  
  # Google APIs
  google_sign_in: ^6.1.6
  googleapis: ^11.4.0
  googleapis_auth: ^1.4.1
  flutter_secure_storage: ^9.0.0
  
  # OAuth & Deep Links
  url_launcher: ^6.2.2
  uni_links: ^0.5.1
  
  # Audio Recording
  record: ^5.0.4
  permission_handler: ^11.0.1
  
  # Camera & Image
  image_picker: ^1.0.4
  camera: ^0.10.5+5
  
  # Connectivity
  connectivity_plus: ^5.0.2
  
  # UI Components
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  
  # Utilities
  intl: ^0.18.1
  uuid: ^4.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  mockito: ^5.4.4
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
