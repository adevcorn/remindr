name: Backend CI

on:
  push:
    branches: [ main, feature/*, fix/* ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: remindr_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: remindr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: backend/requirements.txt
    
    - name: Install dependencies
      working-directory: backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 mypy black isort pylint pytest-cov
    
    - name: Verify dependencies
      working-directory: backend
      run: |
        pip list
        python -c "import fastapi; print(f'FastAPI version: {fastapi.__version__}')"
        python -c "import sqlalchemy; print(f'SQLAlchemy version: {sqlalchemy.__version__}')"
    
    - name: Check code formatting with Black
      working-directory: backend
      run: |
        black --check --diff app/
    
    - name: Check import sorting with isort
      working-directory: backend
      run: |
        isort --check-only --diff app/
    
    - name: Lint with flake8
      working-directory: backend
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings. Line length set to 100 for FastAPI conventions
        flake8 app/ --count --exit-zero --max-complexity=15 --max-line-length=100 --statistics
    
    - name: Lint with pylint
      working-directory: backend
      run: |
        pylint app/ --max-line-length=100 --disable=C0111,R0903,W0212 --exit-zero || true
    
    - name: Type check with mypy
      working-directory: backend
      run: |
        mypy app/ --ignore-missing-imports --no-strict-optional --check-untyped-defs || true
    
    - name: Run tests with pytest
      working-directory: backend
      env:
        DATABASE_URL: postgresql://remindr_test:test_password@localhost:5432/remindr_test
        REDIS_URL: redis://localhost:6379/0
        SECRET_KEY: test-secret-key-for-ci-only
        AI_CONFIDENCE_THRESHOLD: 0.85
        GOOGLE_APPLICATION_CREDENTIALS: /tmp/fake-credentials.json
        PYTHONPATH: .
      run: |
        # Create fake Google credentials for tests with valid RSA key
        cat > /tmp/fake-credentials.json <<'EOF'
        {
          "type": "service_account",
          "project_id": "test",
          "client_email": "test@test.iam.gserviceaccount.com",
          "token_uri": "https://oauth2.googleapis.com/token",
          "private_key_id": "test",
          "private_key": "-----BEGIN PRIVATE KEY-----\nMIIEvQIBADANBgkqhkiG9w0BAQEFAASCBKcwggSjAgEAAoIBAQCfV+RHxCYzQuEE\nOJ04Rcukye1mOXV6DL4ihjQLpNsrTRtE3YtrDCUWrhFg49l7kcre5rboRYs9DNHU\nIb3f73sP+lomRCkQhSYcRAPpmUhATmwYALAUgTdom+iViJIhS14s4TcYtLCLmSEl\nHEeI3szb9NmZagvMk70nbsMGkLVZbmWzgOrUm+8TY06wiiprJ7eCZSStmnEOJFby\nPHZtyrq+QuRSVEzeEATp7SZqNz6Q7u26ztAfedfFF0o5lEgOo9M31MqHB9n2ZYZd\nyH/n/6wE/Y0oqVIG3Y3m30hX1T9WcYyvKt5ChxtTDCwgVXduW0iyHFuLIRLMrI+x\nhup7y2ZVAgMBAAECggEAHtpsIYhFtEnIG6LhsGZ1UMZnoRJRoK0MeM9fDv0gEfGX\nbN1v9C2RFePlCgt8Tjyz2Ta3pmBm3k6X53kUFKMAg17Aq2WpxODfOPxjfI0ZTBhT\nPk+NyJ6fjbIYljGwR+GZzdta6X39LD6diBvCbypi5NkzdAzwVW+q4dKE0UXeU38q\nReSLZTH7zsYywVEu9fNmokMZ9+/cXWBltWBD1IXEW68eRFA01pAUvb7WRDLPochg\nCGoZgXC7r/jTnryvLbl49IXvQKO0quliSdL4/O/lXVi9OQEWoDstoX2kuiF3JtgV\ndc1G0ICAp/hTi3Kfu1yKFJ3H0w5DgL6HPlqwRl6XKQKBgQDTlfvkMqWglPv+SXDB\nLwVNEyu9cFpz7qn2+htcwVDNOKPJYe/eU9TMonrskreah6DwnuDeeejDU73X94JN\nSJ2iw8fqhnL9nis1F2KkF9tfVAtIKN0Iqhsj4a8UWNWW9w9ghY0jeCGoiGB4YMX2\nwPd17e6XN8czLJCoQQizMav6LQKBgQDAyosocGXL/pzdXyMMbDyMldosZYuiYGgz\nny8H+b1ldgR/4odHZwjnx3jsY5LUVeJUgY6idXkCjfnGgzSGGGpzAbPc4P7JdapS\nvlSneqXRsmwIK5/PlknzBZyIJTlb6vnjYMBUkdAEpgaCTUm1OFyL+n6QYvGQXNBR\neZ9+uox9yQKBgQCZVYo0N9f75bww7fv+pBrNXmVGZhPHDGC0EVCfCaGK988KdCUn\nE82VdvJqW3EfVcb2Wc1QrTxXwWpFBqOxajyC5isM9N6EmYlqckYT8Q4TqY57ftGg\nI9aDTFxa/H3dZ7IHGwHLgJWz0xFGa6tLRVCQcBuGDvAXT+aNaIPriMW/CQKBgHhn\nhtVwrQLkN0/CNP9zMbWTeTi1CqoUj799sT/H51NQi6ra7SXY4aTv3UO1RGQ8Zyfj\n6hLoTvUbel1SYCFHamP9MjnGgxmK1R7sI66dWKZISlQn+p0I/ZI7dPFKXjJb5Ejv\nie7HSiU9E1+ZqWj2lEYP4a+HO9qvPKNF1CivlUKRAoGAAPWT/NWhkb9ccEp5rEAQ\nEkakhn2l4oZvwAOvJUtHPGwH1srjYpkDEAmr2n8CMAJ7+re3gXul5JvZORlUNrLH\nBz30EDTpSgAGdLvx4RlNpWPfRIRtazA3zcBkhZC67S0S8DxDXoeCH0T0ONVGv31z\nLXZs3RlJFxRDrfmJTKE7DbA=\n-----END PRIVATE KEY-----\n"
        }
        EOF
        # Run tests with coverage - fail build if tests fail
        pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-report=html
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      if: matrix.python-version == '3.12'
      with:
        file: ./backend/coverage.xml
        flags: backend
        name: backend-coverage
      continue-on-error: true
    
    - name: Security check with bandit
      working-directory: backend
      run: |
        pip install bandit
        bandit -r app/ -ll -x app/tests/ || true
    
    - name: Check for dependency vulnerabilities
      working-directory: backend
      run: |
        pip install safety
        safety check --json || true

  build-verification:
    runs-on: ubuntu-latest
    needs: lint-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: backend/requirements.txt
    
    - name: Install dependencies
      working-directory: backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Verify FastAPI application starts
      working-directory: backend
      env:
        DATABASE_URL: sqlite:///./test.db
        REDIS_URL: redis://localhost:6379/0
        SECRET_KEY: test-secret-key
        AI_CONFIDENCE_THRESHOLD: 0.85
      run: |
        timeout 10 python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        sleep 5
        curl -f http://localhost:8000/health || exit 1
        curl -f http://localhost:8000/ || exit 1
        echo "✓ Backend application started successfully"
