name: Backend CI

on:
  push:
    branches: [ main, feature/*, fix/* ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: remindr_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: remindr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: backend/requirements.txt
    
    - name: Install dependencies
      working-directory: backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 mypy black isort pylint pytest-cov
    
    - name: Verify dependencies
      working-directory: backend
      run: |
        pip list
        python -c "import fastapi; print(f'FastAPI version: {fastapi.__version__}')"
        python -c "import sqlalchemy; print(f'SQLAlchemy version: {sqlalchemy.__version__}')"
    
    - name: Check code formatting with Black
      working-directory: backend
      run: |
        black --check --diff app/
    
    - name: Check import sorting with isort
      working-directory: backend
      run: |
        isort --check-only --diff app/
    
    - name: Lint with flake8
      working-directory: backend
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings. Line length set to 100 for FastAPI conventions
        flake8 app/ --count --exit-zero --max-complexity=15 --max-line-length=100 --statistics
    
    - name: Lint with pylint
      working-directory: backend
      run: |
        pylint app/ --max-line-length=100 --disable=C0111,R0903,W0212 --exit-zero || true
    
    - name: Type check with mypy
      working-directory: backend
      run: |
        mypy app/ --ignore-missing-imports --no-strict-optional --check-untyped-defs || true
    
    - name: Run tests with pytest
      working-directory: backend
      env:
        DATABASE_URL: postgresql://remindr_test:test_password@localhost:5432/remindr_test
        REDIS_URL: redis://localhost:6379/0
        SECRET_KEY: test-secret-key-for-ci-only
        AI_CONFIDENCE_THRESHOLD: 0.85
        GOOGLE_APPLICATION_CREDENTIALS: /tmp/fake-credentials.json
      run: |
        # Create fake Google credentials for tests
        echo '{"type": "service_account", "project_id": "test"}' > /tmp/fake-credentials.json
        # Run tests with coverage - fail build if tests fail
        pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-report=html
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      if: matrix.python-version == '3.12'
      with:
        file: ./backend/coverage.xml
        flags: backend
        name: backend-coverage
      continue-on-error: true
    
    - name: Security check with bandit
      working-directory: backend
      run: |
        pip install bandit
        bandit -r app/ -ll -x app/tests/ || true
    
    - name: Check for dependency vulnerabilities
      working-directory: backend
      run: |
        pip install safety
        safety check --json || true

  build-verification:
    runs-on: ubuntu-latest
    needs: lint-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: backend/requirements.txt
    
    - name: Install dependencies
      working-directory: backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Verify FastAPI application starts
      working-directory: backend
      env:
        DATABASE_URL: sqlite:///./test.db
        REDIS_URL: redis://localhost:6379/0
        SECRET_KEY: test-secret-key
        AI_CONFIDENCE_THRESHOLD: 0.85
      run: |
        timeout 10 python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        sleep 5
        curl -f http://localhost:8000/health || exit 1
        curl -f http://localhost:8000/ || exit 1
        echo "✓ Backend application started successfully"
