# Kubernetes deployment configuration for Remindr Backend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: remindr-backend
  labels:
    app: remindr
    component: backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: remindr
      component: backend
  template:
    metadata:
      labels:
        app: remindr
        component: backend
    spec:
      containers:
      - name: backend
        image: gcr.io/PROJECT_ID/remindr-backend:latest
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: remindr-secrets
              key: database-url
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: remindr-secrets
              key: secret-key
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: /var/secrets/google/service-account.json
        - name: GOOGLE_CLOUD_PROJECT
          valueFrom:
            configMapKeyRef:
              name: remindr-config
              key: google-cloud-project
        - name: GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: remindr-secrets
              key: google-client-id
        - name: GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: remindr-secrets
              key: google-client-secret
        - name: AI_CONFIDENCE_THRESHOLD
          valueFrom:
            configMapKeyRef:
              name: remindr-config
              key: ai-confidence-threshold
        - name: SYNC_RETRY_MAX_ATTEMPTS
          valueFrom:
            configMapKeyRef:
              name: remindr-config
              key: sync-retry-max-attempts
        - name: SYNC_RETRY_BACKOFF_BASE
          valueFrom:
            configMapKeyRef:
              name: remindr-config
              key: sync-retry-backoff-base
        - name: API_V1_PREFIX
          value: /api/v1
        - name: CORS_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: remindr-config
              key: cors-origins
        volumeMounts:
        - name: google-credentials
          mountPath: /var/secrets/google
          readOnly: true
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
      volumes:
      - name: google-credentials
        secret:
          secretName: google-service-account

---
apiVersion: v1
kind: Service
metadata:
  name: remindr-backend
  labels:
    app: remindr
    component: backend
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: remindr
    component: backend

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: remindr-backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: remindr-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max
